server {
  listen 8080;
  server_name _;

  root /var/www/html/public;
  index index.php;

  # Optional: quick health check endpoint
  location = /healthz {
    try_files /healthz =404;
    add_header Content-Type text/plain;
  }

  location / {
    try_files $uri /index.php$is_args$args;
  }

  # Only pass the front controller to php-fpm
  location ~ ^/index\.php(/|$) {
    include fastcgi_params;

    fastcgi_pass frontend_php_fpm:9000;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;

    # critical: make SCRIPT_FILENAME resolve to /var/www/html/public/index.php
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   $document_root;

    fastcgi_read_timeout 60s;

    internal;
  }

  # Block direct access to other .php files
  location ~ \.php$ {
    return 404;
  }

  # Block dotfiles
  location ~ /\.(?!well-known).* {
    deny all;
  }
}
