server {
  listen 8080;
  server_name _;

  root /var/www/html/public;
  index index.php;

  # Optional: quick health check endpoint
  location = /healthz {
    try_files /healthz =404;
    add_header Content-Type text/plain;
  }

  location / {
    try_files $uri /index.php$is_args$args;
  }

  # Only pass the front controller to php-fpm
  location ~ ^/index\.php(/|$) {
    include fastcgi_params;

    # Ensure Symfony sees the forwarded headers from nginx_gateway
    fastcgi_param HTTP_X_FORWARDED_HOST  $http_x_forwarded_host;
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_PORT  $http_x_forwarded_port;
    fastcgi_param HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;

    # Make the CGI vars align with the external scheme/port
    fastcgi_param REQUEST_SCHEME $http_x_forwarded_proto;
    fastcgi_param SERVER_PORT    $http_x_forwarded_port;

    # IMPORTANT: mark request as HTTPS when forwarded proto is https
    set $fcgi_https "";
    if ($http_x_forwarded_proto = "https") { set $fcgi_https "on"; }
    fastcgi_param HTTPS $fcgi_https;

    fastcgi_pass frontend_php_fpm:9000;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;

    # critical: make SCRIPT_FILENAME resolve to /var/www/html/public/index.php
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT   $document_root;

    fastcgi_read_timeout 60s;

    internal;
  }

  # Block direct access to other .php files
  location ~ \.php$ {
    return 404;
  }

  # Block dotfiles
  location ~ /\.(?!well-known).* {
    deny all;
  }
}
