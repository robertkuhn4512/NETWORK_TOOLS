security:
    providers:
        keycloak_users:
            id: App\Security\KeycloakUserProvider

    firewalls:
        main:
            lazy: true
            provider: keycloak_users
            custom_authenticators:
                - App\Security\KeycloakAuthenticator
            entry_point: App\Security\KeycloakAuthenticator

            logout:
                path: app_logout
                invalidate_session: false
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: logout

    access_control:
        # allow OAuth/OIDC callback endpoints and logout endpoints without auth loops
        - { path: ^/logged-out, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/connect, roles: PUBLIC_ACCESS }
        - { path: ^/auth, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_SYMFONY_SUPER_ADMIN }
        - { path: ^/, roles: ROLE_USER }
