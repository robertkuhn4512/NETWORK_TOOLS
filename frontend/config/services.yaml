# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    fastapi.base_url: '%env(resolve:FASTAPI_BASE_URL)%'
    keycloak.token_url: '%env(resolve:KEYCLOAK_AUTH_SERVER_URL)%/realms/%env(resolve:KEYCLOAK_REALM)%/protocol/openid-connect/token'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Security/KeycloakUser.php'

    App\Security\KeycloakAuthenticator:
        autowire: true
        autoconfigure: true

    App\Security\KeycloakUserProvider:
        autowire: true
        autoconfigure: true

    App\Service\Security\KeycloakSessionTokenManager:
        arguments:
            $tokenUrl: '%keycloak.token_url%'
            $clientId: '%env(resolve:KEYCLOAK_CLIENT_ID)%'
            $clientSecret: '%env(KEYCLOAK_CLIENT_SECRET)%'

    App\EventListener\KeycloakLogoutListener:
        arguments:
            $keycloakAuthServerUrl: '%env(KEYCLOAK_AUTH_SERVER_URL)%'
            $keycloakRealm: '%env(KEYCLOAK_REALM)%'
            $keycloakClientId: '%env(KEYCLOAK_CLIENT_ID)%'
            $postLogoutRedirectUri: '%env(APP_LOGOUT_REDIRECT_URL)%'

    App\Service\FastApi\FastApiClient:
        arguments:
            $baseUrl: '%fastapi.base_url%'

    App\Service\FastApi\FrontendTrackingClient:
        arguments:
            $baseUrl: '%fastapi.base_url%'
